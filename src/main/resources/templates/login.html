<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            /*background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);*/

            background:
                    radial-gradient(circle at 18% 48%, #F50000 11%, transparent 35%),
                    radial-gradient(circle at 84% 22%, #5BBD02 13%, transparent 36%),
                    radial-gradient(circle at 74% 82%, #CC0086 9%, transparent 32%),
                    linear-gradient(135deg, #74EBDC 0%, #ACB6E5 80%);
            background-blend-mode: screen;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            width: 350px;
        }
        h2 {

            text-align: center;
            color: #333;
        }
        form input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        form input:focus {
            border-color: #74ebd5;
            outline: none;
            box-shadow: 0 0 5px rgba(116,235,213,0.8);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ACB6E5;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #74ebd5;
        }
        .link {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #555;
            text-decoration: none;
        }
        .link:hover {
            color: #000;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Login </h2>
    <form th:action="@{/login}" method="post">
        <input name="username" placeholder="Email"    required/><br/>
        <input name="password" placeholder="Password" type="password" required/><br/>
        <button type="submit">Login</button>
    </form>
    <a class ="link" href="/register">Create account</a>
    <a class="link-btn" th:href="@{/home}">Back to Home</a>
</div>
</body>
</html>
