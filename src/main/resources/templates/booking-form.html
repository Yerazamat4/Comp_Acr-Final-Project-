
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Jet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            width: 450px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #444;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        select:focus, input:focus {
            border-color: #74ebd5;
            outline: none;
            box-shadow: 0 0 5px rgba(116,235,213,0.8);
        }
        button, .btn {
            width: 90%;
            padding: 12px;
            background: #ACB6E5;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 15px;
            text-decoration: none;
            text-align: center;
            display: block;
        }
        button:hover, .btn:hover {
            background: #74ebd5;
        }
    </style>
</head>
<body th:style="'background-image: url(' + ${jet.photoUrl} + ');'">
<div class="container">
    <h2>Book a Jet</h2>
    <form th:action="@{/bookings}" method="post">
        <input type="hidden" name="jetId" th:value="${jet.id}"/>

        <div class="mb-3">
            <label class="form-label">Departure airport:</label>
            <select class="form-select" name="fromAirportId" required>
                <option th:each="a : ${airports}"
                        th:value="${a.id}"
                        th:text="${a.name} + ' (' + ${a.code} + ')'"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Arrival airport:</label>
            <select class="form-select" name="toAirportId" required>
                <option th:each="a : ${airports}"
                        th:value="${a.id}"
                        th:text="${a.name} + ' (' + ${a.code} + ')'"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Departure date & time:</label>
            <input type="text" id="departureDate" name="departureDate" class="form-control" required/>
        </div>

        <button type="submit" class="btn btn-primary w-100">Confirm booking</button>
    </form>
    <a class="btn btn-secondary w-100 mt-2" th:href="@{/jets}">Back to Jets</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    flatpickr("#departureDate", {
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        time_24hr: true,
        minuteIncrement: 5   // ✅ 5-minute intervals
    });
</script>
</body>
</html>
