<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('/images/home_BG1.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
        }


        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .navbar a {
            margin: 0 15px;
            padding: 10px 18px;
            background: #ACB6E5;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        .navbar a:hover {
            background: #74ebd5;
        }

        .hero {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            text-align: center;
            padding-top: 120px;
        }


        .hero h1 {
            font-size: 48px;
            margin: 0;
            background: linear-gradient(to bottom, #74ebd5 70%, transparent 93%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
<div class="navbar">
    <a th:href="@{/bookings/my}">My Bookings</a>
    <a th:href="@{/jets}">Jets</a>
    <a th:href="@{/login}">Login</a>
</div>

<div class="hero">
    <h1>Welcome to "Jet Booking"</h1>
</div>
</body>
</html>
