<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Bookings</title>
</head>
<body>
<h2>My Bookings</h2>
<div th:each="booking : ${bookings}">
    Jet:    <span th:text="${booking.jet.model}"></span><br/>
    Date:   <span th:text="${booking.departureDate}"></span><br/>
    Route:  <span th:text="${booking.route}"></span><br/>
    Price:  <span th:text="${booking.totalPrice}"></span>$<br/>
    Status: <span th:text="${booking.status}"></span><br/>

    <form th:if="${booking.status == 'CONFIRMED'}"
          th:action="@{/bookings/{id}/cancel(id=${booking.id})}"
          method="post">
        <button type="submit">Cancel</button>
    </form>
    <hr/>
</div>
</body>
</html>
