<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
<h2>Register</h2>
<form th:action="@{/register}" th:object="${user}" method="post">
    <input th:field="*{name}"     placeholder="Name"     required/><br/>
    <input th:field="*{email}"    placeholder="Email"    required/><br/>
    <input th:field="*{password}" placeholder="Password" type="password" required/><br/>
    <input th:field="*{phone_num}" placeholder="Phone"/><br/>
    <button type="submit">Register</button>
</form>
<a href="/login">Already have an account?</a>
</body>
</html>
